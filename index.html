<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medidor de Viadagem</title>

<style>
:root{
    --bg:#f0f0f0;
    --text:#202020;
    --card:#f9f9f9;
    --border:#bbb;
}
body.tema-escuro{
    --bg:#121212;
    --text:#f0f0f0;
    --card:#1f1f1f;
    --border:#444;
}
body{
    font-family:Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    gap:12px;
    max-width:320px;
    margin:0 auto;
    min-height:100vh;
    justify-content:center;
    padding:30px;
    padding-bottom:90px;
    box-sizing:border-box;
    text-align:center;
}
input,button,output{
    border-radius:8px;
    padding:10px;
}
.resposta{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
}
#tema-btn{
    position:fixed;
    top:10px;
    right:10px;
}
</style>
</head>
<body>

<button id="tema-btn" onclick="alternarTema()">🌙 Tema</button>

<h1>Medidor de viadagem</h1>
<input type="text" id="nome" placeholder="Digite seu nome">
<button onclick="mostrarNome()">Enviar</button>
<output class="resposta" id="resposta"></output>

<script>
function carregarTema(){
    const tema = localStorage.getItem("tema") || "claro";
    if(tema === "escuro"){
        document.body.classList.add("tema-escuro");
    }
}
function alternarTema(){
    document.body.classList.toggle("tema-escuro");
    localStorage.setItem(
        "tema",
        document.body.classList.contains("tema-escuro")
        ? "escuro"
        : "claro"
    );
}
carregarTema();

function mostrarNome(){
    const nome = document.getElementById("nome").value.trim().toLowerCase();
    const resposta = document.getElementById("resposta");

    if(nome === "gustavo"){
        resposta.innerHTML = "Esse cara é muito é massa, né nao";
    }else{
        resposta.innerHTML = "Aqui você pode colar o restante do seu código original.";
    }
}
</script>

</body>
</html>
