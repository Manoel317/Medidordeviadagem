<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Medidor de Viadagem</title>

	<style>
		body {
			font-family: Arial, sans-serif;
			background-color: #f0f0f0;
			display: flex;
			flex-direction: column;
			gap: 12px;
			max-width: 320px;
			margin: 0 auto;
			min-height: 100vh;
			justify-content: center;
			padding: 30px;
			padding-bottom: 90px; /* espaço pro botão fixo */
			box-sizing: border-box;
			text-align: center;
		}

		h1 {
			font-family: "Comic Sans MS", cursive;
			font-size: 1.8rem;
			margin-bottom: 10px;
		}

		input, select, button, output {
			font-size: 1rem;
			padding: 10px;
			border: 1px solid #ccc;
			border-radius: 8px;
		}

		button {
			cursor: pointer;
			background-color: #2b8cff;
			color: white;
			border: none;
		}

		button:hover {
			background-color: #1a6ed7;
		}

		output.resposta {
			min-height: 36px;
			display: block;
			line-height: 1.4;
			background-color: #f9f9f9;
			color: #202020;
			border: 1px solid #bbb;
			padding: 18px;
			white-space: pre-wrap;
		}

		.canto {
			position: fixed;
			bottom: 10px;
			left: 10px;
			font-size: 0.8rem;
			color: #555;
			opacity: 0.7;
		}

		/* Botão de parar áudio */
		#btn-parar {
			display: none;
			position: fixed;
			bottom: 0;
			left: 0;
			width: 100%;
			padding: 16px;
			background-color: #e53935;
			color: white;
			font-size: 1.1rem;
			font-weight: bold;
			border: none;
			border-radius: 0;
			cursor: pointer;
			z-index: 1000;
			box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
			transition: background-color 0.2s;
		}

		#btn-parar:hover {
			background-color: #b71c1c;
		}
	</style>
	<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js")
      .then(registration => {
        registration.update();
        console.log("Service Worker registrado");
      })
      .catch(error => {
        console.log("Erro no Service Worker:", error);
      });
  });
}
</script>
</head>

    <link rel="icon" href="icone.png" type="image/png">

<body>

	<h1>Medidor de viadagem</h1>

	<input type="text" id="nome" placeholder="Digite seu nome">
	<button onclick="mostrarNome()">Enviar</button>
	<output class="resposta" id="resposta"></output>

	<div class="canto">
		Versão 1.0.8 - Novos nomes adicionados e função de parar áudios adicionada
	</div>

	<footer>
		<p>&copy; Manoel e Gustavo todos os direitos reservados</p>
	</footer>

	<!-- Botão fixo de parar áudio -->
	<button id="btn-parar" onclick="pararAudio()">⏹ Parar áudio</button>

	<script>

	var audioAtual = null;

	function tocarAudio(audio) {
		// Para qualquer áudio que esteja tocando
		if (audioAtual && audioAtual !== audio) {
			audioAtual.pause();
			audioAtual.currentTime = 0;
		}
		audio.currentTime = 0;
		audio.play();
		audioAtual = audio;

		// Mostra o botão de parar
		document.getElementById('btn-parar').style.display = 'block';

		// Quando o áudio terminar, esconde o botão
		audio.onended = function() {
			document.getElementById('btn-parar').style.display = 'none';
			audioAtual = null;
		};
	}

	function pararAudio() {
		if (audioAtual) {
			audioAtual.pause();
			audioAtual.currentTime = 0;
			audioAtual = null;
		}
		document.getElementById('btn-parar').style.display = 'none';
	}

	function mostrarNome() {
		
		var queima = new Audio('Queima.mp3')
    	var beatbox = new Audio('Beat.mp3')
		var inst = new Audio('Inst.mp3')
		var nome = document.getElementById('nome').value.trim().toLowerCase()
		var resposta = document.getElementById('resposta')
		var audio = new Audio('redline.mp3')
	    var ui = new Audio('ui.mp3')
	    var zeDaManga = new Audio('ze da manga.mp3')
	    var sixseven = new Audio('67.mp3')
    	var gigachad = new Audio('giga-chad-theme.mp3')
		var ph = new Audio('PH.mp3')
		var annajulia = new Audio('Los hermanos - Anna Júlia - Los Hermanos (youtube).mp3.mp3')
		var kickbuttowski = new Audio('kickbuttowski.mp3')
		var weare = new Audio('weare.mp3')
		var numb = new Audio('numb.mp3')


		if (nome === '') {
			resposta.innerHTML = 'digita'
			pararAudio()

		} else if (nome === 'arthur') {
			resposta.innerHTML = 'Você é muito viado e dá a bunda<br><img src="arthur.gif" style="display: block; margin: auto;">'
			tocarAudio(queima)

		} else if (nome === 'manoel') {
			resposta.innerHTML = 'Você foi quem criou isso aqui, mas também é muito foda.'
			tocarAudio(gigachad)
			
		} else if (nome === 'ana júlia') {
			resposta.innerHTML = 'tanto faz, fodase'

		} else if (nome === 'gustavo') {
			resposta.innerHTML = 'Esse cara é muito é massa, né nao'
			tocarAudio(beatbox)

		} else if (nome === 'anna júlia') {
			resposta.innerHTML = 'essa é aquela música la dos los hermanos, acho foda'
			tocarAudio(annajulia)

		} else if (nome === 'davi guilherme') {
			resposta.innerHTML = '<img src="UNO-Reverse-Card-PNG-Image-File.png" width="200">'
			tocarAudio(inst)

		} else if (nome === 'miguel leoncio') {
			resposta.innerHTML = 'anão'

		} else if (nome === 'duda') {
			resposta.innerHTML = 'é um pouco complicado calcular viadagem de mulher, se é que isso é possivel'

		} else if (nome === 'maria eduarda') {
			resposta.innerHTML = 'é um pouco complicado calcular viadagem de mulher, se é que isso é possivel'

		} else if (nome === 'nathan') {
			resposta.innerHTML = 'tratador de arthur gomes'
			tocarAudio(gigachad)

		} else if (nome === 'nycolle') {
			resposta.innerHTML = 'lesbica'

		} else if (nome === 'aylla') {
			resposta.innerHTML = 'deve ter, não sei'

		} else if (nome === 'não') {

			tocarAudio(gigachad)

		} else if (nome === 'ana carolina') {
			resposta.innerHTML = 'ei voce sabia que o gustavo ele<br>(mensagem bloqueada pelo admnistrador)'

		} else if (nome === 'enzy') {
			resposta.innerHTML = 'esse caba fez o mic mayhem ele é massa'
			tocarAudio(audio)

		} else if (nome === 'ricardo') {
			resposta.innerHTML = 'nem um pouco gay'
			tocarAudio(gigachad)

		} else if (nome === 'carlos') {
			resposta.innerHTML = '👍'
			tocarAudio(audio)

		} else if (nome === 'vinícius') {
			resposta.innerHTML = 'não sei, vou perguntar pra ele depois'

		} else if (nome === 'joão lucas') {
			resposta.innerHTML = 'parece esse cara aí<br><img src="joaolucas.png" width="200">'

		} else if (nome === 'sthefany') {

			resposta.innerHTML = 'maria sapatão'

		} else if (nome === 'miguel lucena') {
			resposta.innerHTML = 'calculando...'

		} else if (nome === 'ana') {
			resposta.innerHTML = 'qual delas'

		} else if (nome === 'clara') {
			resposta.innerHTML = 'beijo do douglas'
			tocarAudio(ui)

		} else if (nome === '67') {

		} else if (nome === 'douglas') {

			tocarAudio(gigachad)
			
		} else if (nome === 'kaique') {

			tocarAudio(queima)
			
		} else if (nome === 'ph') {
			resposta.innerHTML = 'Tarado!'
			tocarAudio(ph)

		} else if (nome === 'ana luiza') {
			var n = prompt('Insira sua mensagem')

			tocarAudio(kickbuttowski)

			
		} else if (nome === 'luffy') {

			tocarAudio(weare)

		} else if (nome === 'linkin park') {
			resposta.innerHTML = 'Numb - Linkin Park'
			tocarAudio(numb)

         } else if (nome === 'áudios') {
          resposta.innerHTML = `
        <b>Escolha qual áudio quer tocar:</b><br><br>
        <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">
            <button onclick="tocarAudio(new Audio('Queima.mp3'))">🔥 Queima</button>
            <button onclick="tocarAudio(new Audio('Beat.mp3'))">🥁 Beatbox</button>
            <button onclick="tocarAudio(new Audio('Inst.mp3'))">🃏 Inst</button>
            <button onclick="tocarAudio(new Audio('redline.mp3'))">🎵 Redline</button>
            <button onclick="tocarAudio(new Audio('ui.mp3'))">🔔 UI</button>
            <button onclick="tocarAudio(new Audio('ze da manga.mp3'))">🥭 Zé da Manga</button>
            <button onclick="tocarAudio(new Audio('67.mp3'))">6️⃣7️⃣ 67</button>
            <button onclick="tocarAudio(new Audio('giga-chad-theme.mp3'))">💪 Giga Chad</button>
            <button onclick="tocarAudio(new Audio('PH.mp3'))">😏 PH</button>
            <button onclick="tocarAudio(new Audio('Los hermanos - Anna Júlia - Los Hermanos (youtube).mp3.mp3'))">🎸 Anna Júlia</button>
            <button onclick="tocarAudio(new Audio('kickbuttowski.mp3'))">🛹 Kick Buttowski</button>
            <button onclick="tocarAudio(new Audio('weare.mp3'))">🏴‍☠️ We Are</button>
            <button onclick="tocarAudio(new Audio('numb.mp3'))">🎤 Numb</button>
        </div>
    `
	     } else if {
			resposta.innerHTML = 'Esse nome não se encontra em nossos sistema, tente mais tarde assim que atualizar'
		}
	}
	</script>


</body>
</html>
